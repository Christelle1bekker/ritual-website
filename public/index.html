<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ritual</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0a0a0a;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .hero {
      text-align: center;
      padding: 2rem;
      max-width: 800px;
    }
    h1 {
      font-size: 4rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #fff 0%, #888 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 1.25rem;
      color: #888;
      line-height: 1.6;
      margin-bottom: 2rem;
    }
    .cta {
      display: inline-block;
      padding: 0.875rem 2rem;
      background: #fff;
      color: #0a0a0a;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .cta:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Ritual</h1>
    <p>Build habits that stick. Track your daily rituals and watch consistency compound over time.</p>
    <a href="#" class="cta">Get Started</a>
  </div>
</body>
</html>
